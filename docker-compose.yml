services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: assistant
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-app}@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /uploads
    volumes: [uploads:/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-app}@postgres:5432/assistant
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /uploads
    volumes: [uploads:/uploads]
    depends_on:
      backend: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on: [backend]

  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    restart: unless-stopped
    depends_on: [frontend]

volumes:
  pgdata:
  uploads:
