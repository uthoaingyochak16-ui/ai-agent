server {
  listen 80;
  client_max_body_size 55m;                      # document uploads (50 MB limit in the API)
  root /usr/share/nginx/html;

  # One public host: the dashboard, the API and Meta's webhooks.
  location /api/      { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /webhooks/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /healthz   { proxy_pass http://backend:8000; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
